name: Project Management Tool CI/CD

on:
  push:
    branches:
      - "**"
    paths:
      - "Project Management Tool/**"
      - ".github/workflows/project-management-tool-ci.yml"
  pull_request:
    paths:
      - "Project Management Tool/**"
      - ".github/workflows/project-management-tool-ci.yml"

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Stage 1 - Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Project Management Tool/server/package-lock.json

      - name: Install backend dependencies
        working-directory: Project Management Tool/server
        run: npm ci

      - name: Run backend unit tests
        working-directory: Project Management Tool/server
        run: npm run test:unit

  backend-bdd-tests:
    name: Stage 1 - Backend BDD Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Project Management Tool/server/package-lock.json

      - name: Install backend dependencies
        working-directory: Project Management Tool/server
        run: npm ci

      - name: Run backend BDD tests
        working-directory: Project Management Tool/server
        run: npm run test:bdd

  backend-integration-tests:
    name: Stage 1 - Backend Integration Tests (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: project_management_test
          MYSQL_USER: integration_user
          MYSQL_PASSWORD: integration_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Project Management Tool/server/package-lock.json

      - name: Install MySQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uintegration_user -pintegration_pass --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Install backend dependencies
        working-directory: Project Management Tool/server
        run: npm ci

      - name: Run backend integration tests
        working-directory: Project Management Tool/server
        env:
          NODE_ENV: test
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: integration_user
          MYSQL_PASSWORD: integration_pass
          MYSQL_DATABASE: project_management_test
          MYSQL_PORT: 3306
          MYSQL_POOL_SIZE: 6
        run: npm run test:integration

  frontend-unit-tests:
    name: Stage 1 - Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Project Management Tool/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: Project Management Tool/client
        run: npm ci

      - name: Run frontend unit tests
        working-directory: Project Management Tool/client
        env:
          CI: true
        run: npm test -- --watch=false --passWithNoTests

  ci-test-gate:
    name: Stage 2 - Test Gate (Tests Only)
    runs-on: ubuntu-latest
    needs:
      - backend-unit-tests
      - backend-bdd-tests
      - backend-integration-tests
      - frontend-unit-tests

    steps:
      - name: Confirm all test jobs passed
        run: echo "All test stages passed. CI test gate is green."

  frontend-build:
    name: Stage 3 - Frontend Build Validation
    runs-on: ubuntu-latest
    needs:
      - ci-test-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Project Management Tool/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: Project Management Tool/client
        run: npm ci

      - name: Build frontend
        working-directory: Project Management Tool/client
        env:
          CI: true
          REACT_APP_API_BASE_URL: http://localhost:5000
        run: npm run build

  deploy-production:
    name: Stage 4 - Auto Deploy Production (Cloud Run)
    runs-on: ubuntu-latest
    needs:
      - ci-test-gate
      - frontend-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' && secrets.CLOUDSQL_INSTANCE != '' && secrets.MYSQL_USER != '' && secrets.VERTEX_RAG_CORPUS_ID != '' && secrets.RAG_GCS_URI_PREFIX != ''

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build and deploy backend
        id: deploy_backend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: europe-west2
          GAR_REPOSITORY: pm-repo
          CLOUDSQL_INSTANCE: ${{ secrets.CLOUDSQL_INSTANCE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_DATABASE: project_management
          MYSQL_PASSWORD_SECRET: mysql_password
          VERTEX_RAG_CORPUS_ID: ${{ secrets.VERTEX_RAG_CORPUS_ID }}
          RAG_GCS_URI_PREFIX: ${{ secrets.RAG_GCS_URI_PREFIX }}
          GEMINI_MODEL: gemini-3.1-pro-preview
          GEMINI_REGION: global
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          BACKEND_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/pm-backend:$SHORT_SHA"

          docker build -t "$BACKEND_IMAGE" "Project Management Tool/server"
          docker push "$BACKEND_IMAGE"

          gcloud run deploy pm-backend \
            --image "$BACKEND_IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 8080 \
            --add-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --set-env-vars "NODE_ENV=production,CLOUD_SQL_CONNECTION_NAME=$CLOUDSQL_INSTANCE,MYSQL_USER=$MYSQL_USER,MYSQL_DATABASE=$MYSQL_DATABASE,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$REGION,VERTEX_RAG_CORPUS_ID=$VERTEX_RAG_CORPUS_ID,RAG_GCS_URI_PREFIX=$RAG_GCS_URI_PREFIX,GEMINI_MODEL=$GEMINI_MODEL,GEMINI_REGION=$GEMINI_REGION,RAG_TOP_K=4,GEMINI_TEMPERATURE=0.15,GEMINI_MAX_OUTPUT_TOKENS=2048" \
            --set-secrets "MYSQL_PASSWORD=$MYSQL_PASSWORD_SECRET:latest"

          BACKEND_URL="$(gcloud run services describe pm-backend --region "$REGION" --format='value(status.url)')"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Build and deploy frontend
        id: deploy_frontend
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: europe-west2
          GAR_REPOSITORY: pm-repo
          BACKEND_URL: ${{ steps.deploy_backend.outputs.backend_url }}
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          FRONTEND_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/pm-frontend:$SHORT_SHA"

          docker build \
            --build-arg "REACT_APP_API_BASE_URL=$BACKEND_URL" \
            -t "$FRONTEND_IMAGE" \
            "Project Management Tool/client"
          docker push "$FRONTEND_IMAGE"

          gcloud run deploy pm-frontend \
            --image "$FRONTEND_IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 80 \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 80

          FRONTEND_URL="$(gcloud run services describe pm-frontend --region "$REGION" --format='value(status.url)')"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Update backend CORS for deployed frontend
        env:
          REGION: europe-west2
          FRONTEND_URL: ${{ steps.deploy_frontend.outputs.frontend_url }}
        run: |
          gcloud run services update pm-backend \
            --region "$REGION" \
            --update-env-vars "CORS_ALLOWED_ORIGINS=$FRONTEND_URL"

      - name: Print deployment summary
        run: |
          echo "Backend URL: ${{ steps.deploy_backend.outputs.backend_url }}"
          echo "Frontend URL: ${{ steps.deploy_frontend.outputs.frontend_url }}"
