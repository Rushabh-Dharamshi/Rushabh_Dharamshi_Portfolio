services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budget_tracker
      POSTGRES_USER: budget_user
      POSTGRES_PASSWORD: budget_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://budget_user:budget_password@postgres:5432/budget_tracker
      GENERATED_REPORTS_DIR: /app/generated_reports
      LOG_TIMEZONE: Europe/London
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
      FASTMCP_PYTHON_EXECUTABLE: python
      RAG_EMBEDDING_MODEL: nomic-embed-text
      RAG_PERSIST_DIRECTORY: /app/.run/chroma
      RAG_MANIFEST_PATH: /app/.run/rag_manifest.json
      CHROMA_HTTP_HOST: chroma
      CHROMA_HTTP_PORT: 8000
    volumes:
      - ./backend/generated_reports:/app/generated_reports
      - ./backend/.run:/app/.run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - chroma

  chroma:
    image: chromadb/chroma:1.5.9.dev43-amd64
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8000
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  load-test-runner:
    image: grafana/k6:0.50.0
    profiles:
      - load
    environment:
      MONETRA_BASE_URL: http://backend:8000
    volumes:
      - ./load-tests:/scripts:ro
    entrypoint: ["k6"]
    command: ["run", "/scripts/k6/monetra-load.js"]
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:


