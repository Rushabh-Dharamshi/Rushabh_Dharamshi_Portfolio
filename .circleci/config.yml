version: 2.1
setup: true

parameters:
  deploy-oracle:
    type: boolean
    default: false
  run-reliability:
    type: boolean
    default: false

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  monetra-path-filter:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Detect Monetra changes
          command: |
            set -euo pipefail

            if [ "${CIRCLE_BRANCH:-}" = "main" ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_REVISION="HEAD~1"
            else
              git fetch origin main --depth=50
              BASE_REVISION="origin/main"
            fi

            MONETRA_CHANGED=false
            if git diff --name-only "$BASE_REVISION"...HEAD | grep -E '^(Monetra \(Budget Tracker\)/|\.circleci/)'; then
              MONETRA_CHANGED=true
            fi

            AUTO_DEPLOY_ORACLE=false
            if [ "<< pipeline.parameters.deploy-oracle >>" = "true" ] || { [ "${CIRCLE_BRANCH:-}" = "main" ] && [ "$MONETRA_CHANGED" = "true" ]; }; then
              AUTO_DEPLOY_ORACLE=true
            fi

            if [ "$AUTO_DEPLOY_ORACLE" = "true" ] || [ "<< pipeline.parameters.run-reliability >>" = "true" ] || [ "$MONETRA_CHANGED" = "true" ]; then
              printf '{"run-monetra": true, "deploy-oracle": %s, "run-reliability": << pipeline.parameters.run-reliability >>}' "$AUTO_DEPLOY_ORACLE" > /tmp/monetra-continuation.json
            else
              printf '{"run-monetra": false, "deploy-oracle": false, "run-reliability": false}' > /tmp/monetra-continuation.json
            fi
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: /tmp/monetra-continuation.json

workflows:
  monetra-path-filter:
    jobs:
      - monetra-path-filter
