version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@1.1.0

workflows:
  monetra-path-filter:
    jobs:
      - path-filtering/filter:
          name: monetra-path-filter
          base-revision: main
          config-path: .circleci/continue-config.yml
          mapping: |
            Monetra \(Budget Tracker\)/.* run-monetra true
            \.circleci/.* run-monetra true
