version: 2.1

jobs:
  backend-tests:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install backend dependencies
          command: |
            cd "Monetra (Budget Tracker)/backend"
            python -m venv .venv
            . .venv/bin/activate
            pip install -r requirements-dev.txt
      - run:
          name: Run backend tests
          command: |
            cd "Monetra (Budget Tracker)/backend"
            . .venv/bin/activate
            pytest -q --no-cov

  frontend-tests:
    docker:
      - image: cimg/node:22.9
    working_directory: ~/project
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install frontend dependencies
          command: |
            cd "Monetra (Budget Tracker)/frontend"
            npm ci
      - run:
          name: Run frontend tests
          command: |
            cd "Monetra (Budget Tracker)/frontend"
            npm test
      - run:
          name: Run TypeScript check
          command: |
            cd "Monetra (Budget Tracker)/frontend"
            npx tsc --noEmit

  docker-build:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Build backend image
          command: |
            cd "Monetra (Budget Tracker)"
            docker build -t monetra-backend ./backend
      - run:
          name: Build frontend image
          command: |
            cd "Monetra (Budget Tracker)"
            docker build -t monetra-frontend ./frontend

workflows:
  ci:
    jobs:
      - backend-tests
      - frontend-tests
      - docker-build:
          requires:
            - backend-tests
            - frontend-tests
